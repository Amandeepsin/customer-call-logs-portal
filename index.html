        .existing-ticket-warning h3 {

        }
        .existing-ticket-info {

        }
        .existing-ticket-info p {

<body>
    <div id="app"></div>
    <script>
        const firebaseConfig = {

        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const COUNTRIES = [
            'India',
            'United States',
            'Canada',
            'United Kingdom',
            'Australia',
            'Germany',
            'France',
            'Other'
        ];
        
        const CURRENCY_MAP = {
            'India': { symbol: '₹', code: 'INR' },
            'United States': { symbol: '$', code: 'USD' },
            'Canada': { symbol: 'C$', code: 'CAD' },
            'United Kingdom': { symbol: '£', code: 'GBP' },
            'Australia': { symbol: 'A$', code: 'AUD' },
            'Germany': { symbol: '€', code: 'EUR' },
            'France': { symbol: '€', code: 'EUR' },
            'Other': { symbol: '$', code: 'USD' }
        };
        
        function App() {
            const [view, setView] = useState('roleSelect');
            const [tickets, setTickets] = useState([]);
            const [statusFilter, setStatusFilter] = useState('all');
            const [existingTicket, setExistingTicket] = useState(null);
            const [loading, setLoading] = useState(false);
            
            // Agent authentication
            const [agentUsername, setAgentUsername] = useState(() => {
                return sessionStorage.getItem('agentUsername') || '';
            });
            const [agentLoginInput, setAgentLoginInput] = useState('');
            const [agentPassword, setAgentPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);
            
            // Agent ticket history
            const [agentView, setAgentView] = useState('newTicket'); // 'newTicket' or 'history'
            const [agentTickets, setAgentTickets] = useState([]);
            const [allTickets, setAllTickets] = useState([]);
            const [showAllTickets, setShowAllTickets] = useState(false);
            const [editingTicket, setEditingTicket] = useState(null);
            const [agentSearchOrder, setAgentSearchOrder] = useState('');
            const [agentStatusFilter, setAgentStatusFilter] = useState('all');
            
            // Manager filters and search
            const [searchQuery, setSearchQuery] = useState('');
            const [filterCountry, setFilterCountry] = useState('All');
            const [filterDate, setFilterDate] = useState('All');
            const [sortOrder, setSortOrder] = useState('newest');
            
            // Form state
            const [step, setStep] = useState(1);
            const [orderPlaced, setOrderPlaced] = useState(null);
            const [country, setCountry] = useState('');
            const [orderNumber, setOrderNumber] = useState('');
            const [phoneNumber, setPhoneNumber] = useState('');
            const [reasonForCall, setReasonForCall] = useState(null);
            
            // Add/Remove Items flow
            const [orderShipped, setOrderShipped] = useState(null);
            const [refundRequired, setRefundRequired] = useState(null);
            const [refundAmount, setRefundAmount] = useState('');
            const [additionalPaymentRequired, setAdditionalPaymentRequired] = useState(null);
            const [invoiceSent, setInvoiceSent] = useState(false);
            
            // Change Order Details flow
            const [orderDetailsChanged, setOrderDetailsChanged] = useState(null);
            
            // Order Tracking flow
            const [trackingStatus, setTrackingStatus] = useState(null);
            const [estimatedETA, setEstimatedETA] = useState('');
            const [customerSatisfied, setCustomerSatisfied] = useState(null);
            
            // Order Delivered Problem flow
            const [problemType, setProblemType] = useState(null);
            const [videoReceived, setVideoReceived] = useState(false);
            
            // General Inquiry flow
            const [generalQuery, setGeneralQuery] = useState('');
            const [resolutionNotes, setResolutionNotes] = useState('');
            const [generalStatus, setGeneralStatus] = useState(null);
            
            // Common fields
            const [agentNotes, setAgentNotes] = useState('');
            const [successMessage, setSuccessMessage] = useState('');
            const [errorMessage, setErrorMessage] = useState('');
            const [errorFields, setErrorFields] = useState([]);
            
            // Manager view
            const [managerTab, setManagerTab] = useState('escalated');
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [managerResolutionNotes, setManagerResolutionNotes] = useState('');
            const [managerPendingNotes, setManagerPendingNotes] = useState('');
            const [showPendingInput, setShowPendingInput] = useState(false);
            const [deleteConfirmTicket, setDeleteConfirmTicket] = useState(null);
            const [resolutionError, setResolutionError] = useState('');
            const [toasts, setToasts] = useState([]);
            
            const showToast = (message, type = 'info') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, {id, message, type}]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3500);
            };
            
            useEffect(() => {
                if (view === 'manager') {
                    loadTickets();
                }
            }, [view]);
            
            // Check for existing ticket when order number changes
            useEffect(() => {
                const checkExistingTicket = async () => {
                    if (!orderNumber || orderNumber.length < 3) {
                        setExistingTicket(null);
                        return;
                    }
                    
                    try {
                        const snapshot = await db.collection('customerServiceTickets')
                            .where('orderNumber', '==', orderNumber)
                            .limit(1)
                            .get();
                        
                        if (!snapshot.empty) {
                            const ticket = {
                                id: snapshot.docs[0].id,
                                ...snapshot.docs[0].data(),
                                createdAt: snapshot.docs[0].data().createdAt?.toDate()
                            };
                            setExistingTicket(ticket);
                        } else {
                            setExistingTicket(null);
                        }
                    } catch (error) {
                        console.error('Error checking existing ticket:', error);
                    }
                };
                
                const timeoutId = setTimeout(checkExistingTicket, 500);
                return () => clearTimeout(timeoutId);
            }, [orderNumber]);
            
            // Restore agent view if user is logged in via sessionStorage
            useEffect(() => {
                const savedUsername = sessionStorage.getItem('agentUsername');
                if (savedUsername && view === 'roleSelect') {
                    setView('agent');
                }
            }, []);
            
            const loadTickets = async () => {
                try {
                    const snapshot = await db.collection('customerServiceTickets')
                        .orderBy('createdAt', 'desc')
                        .get();
                    
                    const ticketsData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Filter out resolved tickets older than 30 days
                    const thirtyDaysAgo = new Date();
                    thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                    
                    const filteredTickets = ticketsData.filter(ticket => {
                        // Keep all non-resolved tickets (escalated, pending, etc.)
                        if (ticket.status !== 'resolved') {
                            return true;
                        }
                        
                        // For resolved tickets, only keep those from last 30 days
                        if (ticket.timestamp) {
                            const ticketDate = new Date(ticket.timestamp);
                            return ticketDate >= thirtyDaysAgo;
                        }
                        
                        // If no timestamp, keep it (safety fallback)
                        return true;
                    });
                    
                    setTickets(filteredTickets);
                } catch (error) {
                    console.error('Error loading tickets:', error);
                }
            };
            
            const loadAgentTickets = async () => {
                if (!agentUsername) return;
                
                try {
                    const snapshot = await db.collection('customerServiceTickets')
                        .where('agentUsername', '==', agentUsername)
                        .get();
                    
                    const ticketsData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Sort by timestamp in JavaScript (newest first)
                    ticketsData.sort((a, b) => {
                        const dateA = new Date(a.timestamp || 0);
                        const dateB = new Date(b.timestamp || 0);
                        return dateB - dateA; // Newest first
                    });
                    
                    setAgentTickets(ticketsData);
                } catch (error) {
                    console.error('Error loading agent tickets:', error);
                    alert('Error loading tickets: ' + error.message);
                }
            };
            
            const loadAllTickets = async () => {
                try {
                    const snapshot = await db.collection('customerServiceTickets')
                        .get();
                    
                    const ticketsData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Sort by timestamp in JavaScript (newest first)
                    ticketsData.sort((a, b) => {
                        const dateA = new Date(a.timestamp || 0);
                        const dateB = new Date(b.timestamp || 0);
                        return dateB - dateA; // Newest first
                    });
                    
                    setAllTickets(ticketsData);
                } catch (error) {
                    console.error('Error loading all tickets:', error);
                    alert('Error loading all tickets: ' + error.message);
                }
            };
            
            const deleteTicket = async (ticketId) => {
                try {
                    await db.collection('customerServiceTickets').doc(ticketId).delete();
                    
                    // Update local state to remove the ticket
                    setTickets(tickets.filter(t => t.id !== ticketId));
                    setAgentTickets(agentTickets.filter(t => t.id !== ticketId));
                    setAllTickets(allTickets.filter(t => t.id !== ticketId));
                    
                    // Close modal if this ticket was open
                    if (selectedTicket && selectedTicket.id === ticketId) {
                        setSelectedTicket(null);
                    }
                    if (editingTicket && editingTicket.id === ticketId) {
                        setEditingTicket(null);
                    }
                    
                    setDeleteConfirmTicket(null);
                    showToast('Ticket deleted successfully', 'success');
                } catch (error) {
                    console.error('Error deleting ticket:', error);
                    showToast('Error deleting ticket: ' + error.message, 'error');
                }
            };
            
            const resetForm = () => {
                setStep(1);
                setOrderPlaced(null);
                setCountry('');
                setOrderNumber('');
                setPhoneNumber('');
                setReasonForCall(null);
                setOrderShipped(null);
                setRefundRequired(null);
                setRefundAmount('');
                setAdditionalPaymentRequired(null);
                setInvoiceSent(false);
                setOrderDetailsChanged(null);
                setTrackingStatus(null);
                setEstimatedETA('');
                setCustomerSatisfied(null);
                setProblemType(null);
                setVideoReceived(false);
                setGeneralQuery('');
                setResolutionNotes('');
                setGeneralStatus(null);
                setAgentNotes('');
            };
            
            const getProgress = () => {
                if (orderPlaced === null) return 25;
                if (orderPlaced === false && !generalQuery) return 50;
                if (orderPlaced === false && generalQuery && !resolutionNotes) return 75;
                if (orderPlaced === true && !reasonForCall) return 50;
                if (orderPlaced === true && reasonForCall) return 75;
                return 90;
            };
            
            // Get currency symbol based on selected country
            const getCurrencySymbol = () => {
                if (!country) return '$';
                return CURRENCY_MAP[country]?.symbol || '$';
            };
            
            // Determine if ticket will be escalated or resolved
            const getTicketStatus = () => {
                if (!orderPlaced && !generalQuery) return null;
                
                if (orderPlaced === true) {
                    if (reasonForCall === 'add_remove') {
                        if (orderShipped === true) return 'resolved'; // Can't modify shipped
                        if (orderShipped === false && refundRequired === true) return 'escalated'; // Refund needs approval
                        return 'resolved';
                    } else if (reasonForCall === 'change_details') {
                        if (orderShipped === true) return 'escalated'; // Shipped orders need escalation
                        return 'resolved';
                    } else if (reasonForCall === 'tracking') {
                        if (trackingStatus === 'shipped_not_delivered') return 'escalated'; // Needs investigation
                        if (trackingStatus === 'not_shipped' && customerSatisfied === false) return 'escalated'; // Wants refund
                        return 'resolved';
                    } else if (reasonForCall === 'problem_delivered') {
                        return 'escalated'; // Always escalated
                    }
                } else {
                    // General inquiry
                    if (generalStatus === 'escalate') return 'escalated';
                    return 'resolved';
                }
                
                return null;
            };
            
            // Get submit button text based on ticket status
            const getSubmitButtonText = () => {
                const status = getTicketStatus();
                if (loading) return 'Submitting...';
                if (status === 'escalated') return 'Submit & Escalate to Manager';
                if (status === 'resolved') return 'Submit & Mark Resolved';
                return 'Submit Ticket';
            };
            
            const handleSubmitTicket = async () => {
                // Clear previous errors
                setErrorFields([]);
                const errors = [];
                
                // Comprehensive validation
                if (!phoneNumber.trim()) {
                    setErrorMessage('Please enter phone number');
                    errors.push('phoneNumber');
                    setTimeout(() => setErrorMessage(''), 3000);
                    setErrorFields(errors);
                    return;
                }
                
                if (!country) {
                    setErrorMessage('Please select country');
                    errors.push('country');
                    setTimeout(() => setErrorMessage(''), 3000);
                    setErrorFields(errors);
                    return;
                }
                
                if (orderPlaced === null) {
                    setErrorMessage('Please select if order was placed');
                    setTimeout(() => setErrorMessage(''), 3000);
                    return;
                }
                
                if (orderPlaced === true) {
                    if (!orderNumber.trim()) {
                        setErrorMessage('Please enter order number');
                        errors.push('orderNumber');
                        setTimeout(() => setErrorMessage(''), 3000);
                        setErrorFields(errors);
                        return;
                    }
                    
                    if (!reasonForCall) {
                        setErrorMessage('Please select reason for calling');
                        setTimeout(() => setErrorMessage(''), 3000);
                        return;
                    }
                    
                    // Validate based on reason for call
                    if (reasonForCall === 'add_remove') {
                        if (orderShipped === null) {
                            setErrorMessage('Please specify if order has shipped');
                            setTimeout(() => setErrorMessage(''), 3000);
                            return;
                        }
                        
                        if (orderShipped === false) {
                            if (refundRequired === null) {
                                setErrorMessage('Please specify if refund is required');
                                setTimeout(() => setErrorMessage(''), 3000);
                                return;
                            }
                            
                            if (refundRequired === true && !refundAmount.trim()) {
                                setErrorMessage('Please enter refund amount');
                                setTimeout(() => setErrorMessage(''), 3000);
                                return;
                            }
                            
                            if (additionalPaymentRequired === null) {
                                setErrorMessage('Please specify if additional payment is required');
                                setTimeout(() => setErrorMessage(''), 3000);
                                return;
                            }
                        }
                    } else if (reasonForCall === 'change_details') {
                        if (orderShipped === null) {
                            setErrorMessage('Please specify if order has shipped');
                            setTimeout(() => setErrorMessage(''), 3000);
                            return;
                        }
                        
                        if (orderShipped === false && orderDetailsChanged === null) {
                            setErrorMessage('Please specify if order details were changed');
                            setTimeout(() => setErrorMessage(''), 3000);
                            return;
                        }
                    } else if (reasonForCall === 'tracking') {
                        if (!trackingStatus) {
                            setErrorMessage('Please select tracking status');
                            setTimeout(() => setErrorMessage(''), 3000);
                            return;
                        }
                        
                        if (trackingStatus === 'not_shipped') {
                            if (!estimatedETA.trim()) {
                                setErrorMessage('Please enter estimated ETA');
                                setTimeout(() => setErrorMessage(''), 3000);
                                return;
                            }
                            
                            if (customerSatisfied === null) {
                                setErrorMessage('Please specify if customer is satisfied');
                                setTimeout(() => setErrorMessage(''), 3000);
                                return;
                            }
                        }
                    } else if (reasonForCall === 'problem_delivered') {
                        if (!problemType) {
                            setErrorMessage('Please select problem type');
                            setTimeout(() => setErrorMessage(''), 3000);
                            return;
                        }
                        
                        if (!videoReceived) {
                            setErrorMessage('Please confirm that order opening video has been received via email');
                            setTimeout(() => setErrorMessage(''), 3000);
                            return;
                        }
                    }
                } else {
                    // General Inquiry validation
                    if (!generalQuery.trim()) {
                        setErrorMessage('Please enter the customer query');
                        setTimeout(() => setErrorMessage(''), 3000);
                        return;
                    }
                    
                    if (!resolutionNotes.trim()) {
                        setErrorMessage('Please enter how you resolved the query');
                        setTimeout(() => setErrorMessage(''), 3000);
                        return;
                    }
                    
                    if (!generalStatus) {
                        setErrorMessage('Please select status (Resolved or Escalate)');
                        setTimeout(() => setErrorMessage(''), 3000);
                        return;
                    }
                }
                
                // Validate conversation summary / additional notes (required for all tickets)
                if (!agentNotes.trim()) {
                    setErrorMessage('Please provide a conversation summary in Additional Notes');
                    errors.push('agentNotes');
                    setTimeout(() => setErrorMessage(''), 3000);
                    setErrorFields(errors);
                    return;
                }
                
                setLoading(true);
                
                try {
                    const ticketData = {
                        orderPlaced,
                        country,
                        orderNumber: orderNumber || 'N/A',
                        phoneNumber,
                        timestamp: new Date().toISOString(),
                        agentNotes,
                        agentUsername: agentUsername // Track which agent created the ticket
                    };
                    
                    // Try to add server timestamp, but don't fail if permissions don't allow it
                    try {
                        ticketData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    } catch (e) {
                        ticketData.createdAt = new Date().toISOString();
                    }
                    
                    if (orderPlaced) {
                        ticketData.reasonForCall = reasonForCall;
                        
                        if (reasonForCall === 'add_remove') {
                            ticketData.orderShipped = orderShipped;
                            
                            if (orderShipped) {
                                ticketData.status = 'resolved';
                                ticketData.resolution = 'Customer informed that items cannot be added/removed from shipped orders';
                            } else {
                                ticketData.refundRequired = refundRequired;
                                
                                if (refundRequired) {
                                    ticketData.status = 'escalated';
                                    ticketData.refundAmount = parseFloat(refundAmount);
                                    ticketData.resolution = 'Order edited in Shopify - Refund required';
                                } else {
                                    ticketData.status = 'resolved';
                                    ticketData.resolution = 'Order edited in Shopify successfully';
                                }
                                
                                ticketData.additionalPaymentRequired = additionalPaymentRequired;
                                if (additionalPaymentRequired) {
                                    ticketData.invoiceSent = invoiceSent;
                                }
                            }
                        } else if (reasonForCall === 'change_details') {
                            ticketData.orderShipped = orderShipped;
                            
                            if (orderShipped) {
                                ticketData.status = 'escalated';
                                ticketData.resolution = 'Order already shipped - Customer needs assistance with details change';
                            } else {
                                ticketData.orderDetailsChanged = orderDetailsChanged;
                                ticketData.status = 'resolved';
                                ticketData.resolution = orderDetailsChanged 
                                    ? 'Customer updated details via email link'
                                    : 'Agent updated details in Shopify';
                            }
                        } else if (reasonForCall === 'tracking') {
                            ticketData.trackingStatus = trackingStatus;
                            
                            if (trackingStatus === 'shipped_not_delivered') {
                                ticketData.status = 'escalated';
                                ticketData.resolution = 'Order shipped but not delivered - needs investigation';
                            } else if (trackingStatus === 'not_shipped') {
                                ticketData.estimatedETA = estimatedETA;
                                ticketData.customerSatisfied = customerSatisfied;
                                
                                if (customerSatisfied) {
                                    ticketData.status = 'resolved';
                                    ticketData.resolution = `Customer satisfied with ETA: ${estimatedETA}`;
                                } else {
                                    ticketData.status = 'escalated';
                                    ticketData.resolution = 'Customer not satisfied - wants refund';
                                }
                            }
                        } else if (reasonForCall === 'problem_delivered') {
                            ticketData.problemType = problemType;
                            ticketData.videoReceived = videoReceived;
                            ticketData.status = 'escalated';
                            ticketData.resolution = problemType === 'missing_wrong' 
                                ? 'Missing or wrong item in order - Order opening video received'
                                : 'Whole order wrong - Order opening video received';
                        }
                    } else {
                        // General Inquiry
                        ticketData.generalQuery = generalQuery;
                        ticketData.resolutionNotes = resolutionNotes;
                        ticketData.status = generalStatus === 'escalate' ? 'escalated' : 'resolved';
                        ticketData.resolution = resolutionNotes;
                    }
                    
                    await db.collection('customerServiceTickets').add(ticketData);
                    
                    setSuccessMessage('Ticket submitted successfully!');
                    setTimeout(() => setSuccessMessage(''), 3000);
                    resetForm();
                } catch (error) {
                    console.error('Error submitting ticket:', error);
                    console.error('Error details:', error.code, error.message);
                    
                    // Show detailed error message
                    let errorMsg = 'Error submitting ticket. ';
                    if (error.code === 'permission-denied') {
                        errorMsg += 'Permission denied. Please check Firebase security rules.';
                    } else if (error.message) {
                        errorMsg += error.message;
                    } else {
                        errorMsg += 'Please try again.';
                    }
                    
                    setErrorMessage(errorMsg);
                    setTimeout(() => setErrorMessage(''), 5000);
                } finally {
                    setLoading(false);
                }
            };
            
            const updateTicketStatus = async (ticketId, newStatus, managerNotes = '') => {
                try {
                    await db.collection('customerServiceTickets').doc(ticketId).update({
                        status: newStatus,
                        managerNotes,
                        resolvedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    loadTickets();
                    setSelectedTicket(null);
                } catch (error) {
                    console.error('Error updating ticket:', error);
                }
            };
            
            const handleAgentLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                setLoginLoading(true);
                
                try {
                    const username = agentLoginInput.trim();
                    const password = agentPassword.trim();
                    
                    if (!username || !password) {
                        setLoginError('Please enter both username and password');
                        setLoginLoading(false);
                        return;
                    }
                    
                    // Check credentials against employees collection in Firebase
                    const employeesSnapshot = await db.collection('employees')
                        .where('username', '==', username)
                        .get();
                    
                    if (employeesSnapshot.empty) {
                        setLoginError('Invalid username or password');
                        setLoginLoading(false);
                        return;
                    }
                    
                    const employeeDoc = employeesSnapshot.docs[0];
                    const employee = employeeDoc.data();
                    
                    // Verify password
                    if (employee.password !== password) {
                        setLoginError('Invalid username or password');
                        setLoginLoading(false);
                        return;
                    }
                    
                    // Login successful
                    const loggedInUsername = employee.name || username;
                    setAgentUsername(loggedInUsername);
                    sessionStorage.setItem('agentUsername', loggedInUsername);
                    setLoginError('');
                } catch (error) {
                    console.error('Login error:', error);
                    setLoginError('Login failed. Please try again.');
                } finally {
                    setLoginLoading(false);
                }
            };
            
            const handleAgentLogout = () => {
                setAgentUsername('');
                sessionStorage.removeItem('agentUsername');
                setAgentLoginInput('');
                setAgentPassword('');
                setView('roleSelect');
                resetForm();
            };
            
            // Filter tickets based on search and filters
            const getFilteredTickets = () => {
                let filtered = tickets;
                
                // Filter by tab
                if (managerTab === 'escalated') {
                    filtered = filtered.filter(t => t.status === 'escalated');
                } else if (managerTab === 'resolved') {
                    filtered = filtered.filter(t => t.status === 'resolved');
                } else if (managerTab === 'pending') {
                    filtered = filtered.filter(t => t.status === 'pending');
                }
                
                // Filter by search query
                if (searchQuery.trim()) {
                    const query = searchQuery.toLowerCase();
                    filtered = filtered.filter(t => 
                        (t.orderNumber && t.orderNumber.toLowerCase().includes(query)) ||
                        (t.phoneNumber && t.phoneNumber.includes(query)) ||
                        (t.agentUsername && t.agentUsername.toLowerCase().includes(query)) ||
                        (t.agentNotes && t.agentNotes.toLowerCase().includes(query))
                    );
                }
                
                // Filter by country
                if (filterCountry !== 'All') {
                    filtered = filtered.filter(t => t.country === filterCountry);
                }
                
                // Filter by date
                if (filterDate !== 'All') {
                    const now = new Date();
                    filtered = filtered.filter(t => {
                        const ticketDate = new Date(t.timestamp);
                        const diffDays = Math.floor((now - ticketDate) / (1000 * 60 * 60 * 24));
                        
                        if (filterDate === 'Today') return diffDays === 0;
                        if (filterDate === 'Yesterday') return diffDays === 1;
                        if (filterDate === 'Last 7 Days') return diffDays <= 7;
                        if (filterDate === 'Last 30 Days') return diffDays <= 30;
                        return true;
                    });
                }
                
                // Sort tickets
                filtered.sort((a, b) => {
                    const dateA = new Date(a.timestamp || 0);
                    const dateB = new Date(b.timestamp || 0);
                    
                    if (sortOrder === 'newest') {
                        return dateB - dateA; // Newest first
                    } else {
                        return dateA - dateB; // Oldest first
                    }
                });
                
                return filtered;
            };
            
            // Role Selection View
            if (view === 'roleSelect') {
                return (
                    <div>
                        <div className="header">
                            <h1>Customer Service Ticketing Portal</h1>
                        </div>
                        <div className="container">
                            <div className="role-selector">
                                <div className="role-card" onClick={() => setView('agent')}>
                                    <svg className="icon-large" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                                    </svg>
                                    <h2>Agent</h2>
                                    <p>Create customer service tickets</p>
                                </div>
                                <div className="role-card" onClick={() => setView('manager')}>
                                    <svg className="icon-large" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                                    </svg>
                                    <h2>Manager</h2>
                                    <p>Review & resolve escalated tickets</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            // Agent View
            if (view === 'agent') {
                // If agent not logged in, show login screen
                if (!agentUsername) {
                    return (
                        <div>
                            <div className="header">
                                <h1>Agent Login</h1>
                                <div className="header-right">
                                    <button className="btn btn-secondary" onClick={() => setView('roleSelect')}>
                                        Back
                                    </button>
                                </div>
                            </div>
                            <div className="container">
                                <div style={{maxWidth: '500px', margin: '0 auto', padding: '2rem'}}>
                                    <div className="card">
                                        <h2 style={{marginBottom: '1.5rem', textAlign: 'center'}}>Agent Login</h2>
                                        <form onSubmit={handleAgentLogin}>
                                            <div className="form-group">
                                                <label>Username *</label>
                                                <input
                                                    type="text"
                                                    className="form-control"
                                                    value={agentLoginInput}
                                                    onChange={(e) => setAgentLoginInput(e.target.value)}
                                                    placeholder="Enter your username"
                                                    autoFocus
                                                    required
                                                />
                                            </div>
                                            <div className="form-group">
                                                <label>Password *</label>
                                                <div className="password-input-wrapper">
                                                    <input
                                                        type={showPassword ? "text" : "password"}
                                                        className="form-control"
                                                        value={agentPassword}
                                                        onChange={(e) => setAgentPassword(e.target.value)}
                                                        placeholder="Enter your password"
                                                        required
                                                        style={{paddingRight: '45px'}}
                                                    />
                                                    <button
                                                        type="button"
                                                        className="password-toggle"
                                                        onClick={() => setShowPassword(!showPassword)}
                                                        tabIndex="-1"
                                                    >
                                                        {showPassword ? (
                                                            <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                                                <path fillRule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clipRule="evenodd" />
                                                                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                                                            </svg>
                                                        ) : (
                                                            <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                                                                <path fillRule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clipRule="evenodd" />
                                                            </svg>
                                                        )}
                                                    </button>
                                                </div>
                                            </div>
                                            {loginError && (
                                                <div className="alert alert-error" style={{marginTop: '1rem'}}>
                                                    ⚠️ {loginError}
                                                </div>
                                            )}
                                            <button 
                                                type="submit" 
                                                className="btn btn-primary" 
                                                style={{width: '100%', marginTop: '1.5rem'}}
                                                disabled={loginLoading}
                                            >
                                                {loginLoading ? 'Logging in...' : 'Login'}
                                            </button>
                                        </form>
                                        <p style={{textAlign: 'center', color: '#94a3b8', fontSize: '0.875rem', marginTop: '1.5rem'}}>
                                            🔒 Same credentials as main employee portal
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }
                
                // Agent is logged in, show ticket creation form
                return (
                    <div>
                        <div className="header">
                            <h1>{agentView === 'newTicket' ? 'Agent - New Ticket' : 'Agent - Ticket History'}</h1>
                            <div className="header-right">
                                <span style={{color: '#cbd5e1', marginRight: '1rem'}}>
                                    👤 {agentUsername}
                                </span>
                                <button 
                                    className="btn btn-secondary" 
                                    onClick={() => {
                                        if (agentView === 'newTicket') {
                                            loadAgentTickets();
                                            loadAllTickets();
                                            setAgentView('history');
                                        } else {
                                            setAgentView('newTicket');
                                        }
                                    }}
                                    style={{marginRight: '1rem'}}
                                >
                                    {agentView === 'newTicket' ? '📋 Ticket History' : '➕ New Ticket'}
                                </button>
                                <button className="btn btn-secondary" onClick={handleAgentLogout}>
                                    Logout
                                </button>
                            </div>
                        </div>
                        
                        {agentView === 'newTicket' ? (
                        <div className="container">
                            {successMessage && (
                                <div className="alert alert-success">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"></path>
                                    </svg>
                                    {successMessage}
                                </div>
                            )}
                            
                            {errorMessage && (
                                <div className="alert alert-error">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd"></path>
                                    </svg>
                                    {errorMessage}
                                </div>
                            )}
                            
                            <div className="progress-bar">
                                <div className="progress-fill" style={{width: `${getProgress()}%`}}></div>
                            </div>
                            
                            <div className="card">
                                <div className="step-indicator">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd"></path>
                                    </svg>
                                    How may I help you?
                                </div>
                                
                                {/* Step 1: Basic Information */}
                                <div className="grid-2">

                                        <label>Phone Number *</label>
                                        <input
                                            type="tel"
                                            className={`form-control ${errorFields.includes('phoneNumber') ? 'error' : ''}`}
                                            value={phoneNumber}
                                            onChange={(e) => {
                                                setPhoneNumber(e.target.value);
                                                setErrorFields(errorFields.filter(f => f !== 'phoneNumber'));
                                            }}
                                            placeholder="Enter customer phone number"
                                        />
                                    </div>
                                    
                                    <div className="form-group">

                                                                        disabled={idx >= displayTickets.length-1}
                                                                        title="Next ticket"
                                                                        style={{width:'28px',height:'28px',borderRadius:'6px',border:'1px solid rgba(71,85,105,0.5)',background:'rgba(71,85,105,0.3)',color:'#cbd5e1',fontSize:'13px',cursor:idx<displayTickets.length-1?'pointer':'default',opacity:idx<displayTickets.length-1?1:0.3,display:'flex',alignItems:'center',justifyContent:'center'}}
                                                                    >↓</button>
                                                                    <span style={{fontSize:'0.7rem',color:'#64748b',marginLeft:'2px'}}>{idx+1}/{displayTickets.length}</span>
                                                                </>
                                                            );
                                                        })()}
                                                        <button
                                                            onClick={() => setDeleteConfirmTicket(selectedTicket)}
                                                            style={{padding:'4px 10px',borderRadius:'6px',border:'1px solid rgba(239,68,68,0.4)',background:'rgba(239,68,68,0.12)',color:'#fca5a5',fontSize:'0.7rem',cursor:'pointer',marginLeft:'4px'}}
                                                        >🗑️ Delete</button>
                                                    </div>
                                                </div>
                                                <div style={{display:'flex', gap:'1rem', flexWrap:'wrap', fontSize:'0.75rem', color:'#94a3b8'}}>
                                                    <span>Agent: <span style={{color:'#60a5fa',fontWeight:600}}>{selectedTicket.agentUsername || 'Unknown'}</span></span>
                                                    {selectedTicket.phoneNumber && <span>{selectedTicket.phoneNumber}</span>}
                                                    <span>{selectedTicket.country}</span>
                                                    <span>{selectedTicket.timestamp ? new Date(selectedTicket.timestamp).toLocaleString() : 'N/A'}</span>
                                                </div>
                                            </div>

                                            {/* Detail Body */}
                                            <div style={{flex:1, overflowY:'auto', padding:'1rem 1.25rem', display:'flex', flexDirection:'column', gap:'0.875rem'}}>
                                                {/* Info grid */}
                                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0.5rem'}}>
                                                    {[
                                                        {label:'Issue type', value: selectedTicket.reasonForCall === 'add_remove' ? 'Add/Remove Items' : selectedTicket.reasonForCall === 'change_details' ? 'Change Details' : selectedTicket.reasonForCall === 'tracking' ? 'Order Tracking' : selectedTicket.reasonForCall === 'problem_delivered' ? 'Delivered Problem' : selectedTicket.generalQuery ? 'General Inquiry' : '—'},
                                                        {label:'Ticket type', value: selectedTicket.orderPlaced ? 'Order Issue' : 'General Inquiry'},
                                                        {label:'Phone', value: selectedTicket.phoneNumber || '—'},
                                                        {label:'Country', value: selectedTicket.country || '—'},
                                                    ].map(item => (
                                                        <div key={item.label} style={{background:'rgba(30,41,59,0.7)',border:'1px solid rgba(71,85,105,0.3)',borderRadius:'8px',padding:'0.5rem 0.75rem'}}>
                                                            <div style={{fontSize:'0.65rem',color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'3px'}}>{item.label}</div>
                                                            <div style={{fontSize:'0.8rem',color:'#e2e8f0',fontWeight:500}}>{item.value}</div>
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* Agent summary */}
                                                <div style={{background:'rgba(30,41,59,0.5)',border:'1px solid rgba(71,85,105,0.3)',borderRadius:'8px',padding:'0.75rem'}}>
                                                    <div style={{fontSize:'0.65rem',color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'6px',fontWeight:600}}>Agent conversation summary</div>
                                                    <p style={{fontSize:'0.8rem',color:'#cbd5e1',lineHeight:1.6,whiteSpace:'pre-wrap'}}>
                                                        {selectedTicket.agentNotes || 'No summary provided'}
                                                    </p>
                                                </div>

                                                {/* Agent resolution attempt */}
                                                <div style={{background:'rgba(245,158,11,0.07)',border:'1px solid rgba(245,158,11,0.25)',borderRadius:'8px',padding:'0.75rem'}}>
                                                    <div style={{fontSize:'0.65rem',color:'#92400e',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'6px',fontWeight:600}}>Agent resolution attempt</div>
                                                    <p style={{fontSize:'0.8rem',color:'#fcd34d',lineHeight:1.6}}>
                                                        {selectedTicket.resolution || 'No resolution details'}
                                                    </p>
                                                    {selectedTicket.refundAmount && (
                                                        <p style={{fontSize:'0.8rem',color:'#fbbf24',marginTop:'4px',fontWeight:600}}>
                                                            Refund amount: {(CURRENCY_MAP[selectedTicket.country] || CURRENCY_MAP['Other']).symbol}{parseFloat(selectedTicket.refundAmount).toFixed(2)}
                                                        </p>
                                                    )}
                                                </div>

                                                {/* Pending notes display — visible to all managers */}
                                                {selectedTicket.status === 'pending' && selectedTicket.managerNotes && (
                                                    <div style={{background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.35)',borderRadius:'8px',padding:'0.75rem'}}>
                                                        <div style={{fontSize:'0.65rem',color:'#92400e',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'5px',fontWeight:600}}>⏳ Pending reason — set by manager</div>
                                                        <p style={{fontSize:'0.8rem',color:'#fcd34d',lineHeight:1.6}}>{selectedTicket.managerNotes}</p>
                                                    </div>
                                                )}

                                                {/* Manager Actions */}
                                                {(selectedTicket.status === 'escalated' || selectedTicket.status === 'pending') && (
                                                    <div style={{background:'rgba(30,41,59,0.8)',border:'1px solid rgba(71,85,105,0.5)',borderRadius:'8px',padding:'0.875rem'}}>
                                                        {!showPendingInput && (
                                                            <>
                                                                <div style={{fontSize:'0.75rem',fontWeight:600,color:'#e2e8f0',marginBottom:'0.5rem'}}>Manager resolution notes</div>
                                                                <textarea
                                                                    className="form-control"
                                                                    value={managerResolutionNotes}
                                                                    onChange={(e) => { setManagerResolutionNotes(e.target.value); if (resolutionError) setResolutionError(''); }}
                                                                    placeholder="Describe the action taken or resolution…"
                                                                    rows="3"
                                                                    style={{width:'100%',minHeight:'70px',resize:'vertical',fontSize:'0.8rem',padding:'0.5rem 0.75rem',border: resolutionError ? '1px solid #ef4444' : undefined}}
                                                                />
                                                                {resolutionError ? (
                                                                    <p style={{fontSize:'0.7rem',color:'#f87171',margin:'4px 0 10px',fontWeight:600}}>⚠️ {resolutionError}</p>
                                                                ) : (
                                                                    <p style={{fontSize:'0.7rem',color:'#64748b',margin:'4px 0 10px'}}>Required to mark as resolved</p>
                                                                )}
                                                            </>
                                                        )}

                                                        {/* Inline pending reason input — expands when Mark Pending clicked */}
                                                        {showPendingInput && (
                                                            <div style={{marginBottom:'0.75rem',padding:'0.75rem',background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:'8px'}}>
                                                                <div style={{fontSize:'0.7rem',color:'#f59e0b',fontWeight:600,marginBottom:'6px'}}>Why is this being marked pending?</div>
                                                                <textarea
                                                                    className="form-control"
                                                                    value={managerPendingNotes}
                                                                    onChange={(e) => setManagerPendingNotes(e.target.value)}
                                                                    placeholder="e.g. Waiting for customer to send tracking screenshot, following up with courier…"
                                                                    rows="2"
                                                                    autoFocus
                                                                    style={{width:'100%',minHeight:'56px',resize:'vertical',fontSize:'0.8rem',padding:'0.5rem 0.75rem',marginBottom:'0.5rem'}}
                                                                />
                                                                <div style={{display:'flex',gap:'0.5rem'}}>
                                                                    <button
                                                                        className="btn btn-warning"
                                                                        style={{flex:1,padding:'0.4rem',fontSize:'0.75rem'}}
                                                                        onClick={() => {
                                                                            updateTicketStatus(selectedTicket.id, 'pending', managerPendingNotes);
                                                                            setManagerResolutionNotes('');
                                                                            setManagerPendingNotes('');
                                                                            setShowPendingInput(false);
                                                                        }}
                                                                    >⏳ Confirm — mark pending</button>
                                                                    <button
                                                                        className="btn btn-secondary"
                                                                        style={{padding:'0.4rem 0.75rem',fontSize:'0.75rem'}}
                                                                        onClick={() => { setShowPendingInput(false); setManagerPendingNotes(''); }}
                                                                    >Cancel</button>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {!showPendingInput && (
                                                            <div style={{display:'flex',gap:'0.5rem'}}>
                                                                <button
                                                                    className="btn btn-success"
                                                                    style={{flex:1,padding:'0.5rem',fontSize:'0.8rem'}}
                                                                    onClick={() => {
                                                                        if (!managerResolutionNotes.trim()) {
                                                                            setResolutionError('Please enter resolution details before marking as resolved');
                                                                            return;
                                                                        }
                                                                        setResolutionError('');
                                                                        updateTicketStatus(selectedTicket.id, 'resolved', managerResolutionNotes);
                                                                        setManagerResolutionNotes('');
                                                                        setShowPendingInput(false);
                                                                        setManagerPendingNotes('');
                                                                    }}
                                                                >✓ Mark resolved</button>
                                                                {selectedTicket.status === 'escalated' ? (
                                                                    <button
                                                                        className="btn btn-warning"
                                                                        style={{flex:1,padding:'0.5rem',fontSize:'0.8rem'}}
                                                                        onClick={() => { setShowPendingInput(true); }}
                                                                    >⏳ Mark pending</button>
                                                                ) : (
                                                                    <button
                                                                        className="btn btn-danger"
                                                                        style={{flex:1,padding:'0.5rem',fontSize:'0.8rem'}}
                                                                        onClick={() => { setShowPendingInput(true); }}
                                                                    >⚠️ Re-escalate</button>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}

                                                {selectedTicket.status === 'resolved' && (
                                                    <div style={{background:'rgba(16,185,129,0.1)',border:'1px solid rgba(16,185,129,0.3)',borderRadius:'8px',padding:'0.875rem'}}>
                                                        <p style={{color:'#10b981',fontSize:'0.8rem',marginBottom: selectedTicket.managerNotes ? '0.5rem' : 0}}>✓ This ticket has been resolved</p>
                                                        {selectedTicket.managerNotes && (
                                                            <p style={{color:'#cbd5e1',fontSize:'0.8rem'}}>Manager notes: {selectedTicket.managerNotes}</p>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                        
                        {/* Delete Confirmation Modal */}
                        {deleteConfirmTicket && (
                            <div className="modal-overlay" onClick={() => setDeleteConfirmTicket(null)}>
                                <div className="modal-content" onClick={(e) => e.stopPropagation()} style={{maxWidth: '480px'}}>
                                    <div style={{display:'flex',alignItems:'center',gap:'0.75rem',marginBottom:'1.25rem'}}>
                                        <div style={{width:'40px',height:'40px',borderRadius:'50%',background:'rgba(239,68,68,0.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.25rem'}}>⚠️</div>
                                        <h2 style={{fontSize:'1.25rem',fontWeight:700,color:'#fff'}}>Delete this ticket?</h2>
                                    </div>
                                    
                                    <p style={{fontSize:'0.875rem',color:'#94a3b8',lineHeight:1.6,marginBottom:'1rem'}}>
                                        This will permanently delete the ticket from Firestore. This action cannot be undone.
                                    </p>
                                    
                                    <div style={{background:'rgba(15,23,42,0.6)',border:'1px solid rgba(71,85,105,0.5)',borderRadius:'8px',padding:'0.875rem',marginBottom:'1.25rem'}}>
                                        <div style={{display:'grid',gridTemplateColumns:'auto 1fr',rowGap:'0.5rem',columnGap:'0.875rem',fontSize:'0.8rem'}}>
                                            <span style={{color:'#64748b',fontWeight:600}}>Order #</span>
                                            <span style={{color:'#e2e8f0',fontWeight:600}}>#{deleteConfirmTicket.orderNumber || '—'}</span>
                                            
                                            <span style={{color:'#64748b',fontWeight:600}}>Agent</span>
                                            <span style={{color:'#60a5fa',fontWeight:600}}>{deleteConfirmTicket.agentUsername || 'Unknown'}</span>
                                            
                                            <span style={{color:'#64748b',fontWeight:600}}>Status</span>
                                            <span style={{color:'#e2e8f0',textTransform:'capitalize'}}>{deleteConfirmTicket.status || '—'}</span>
                                            
                                            <span style={{color:'#64748b',fontWeight:600}}>Country</span>
                                            <span style={{color:'#e2e8f0'}}>{deleteConfirmTicket.country || '—'}</span>
                                            
                                            {deleteConfirmTicket.phoneNumber && (
                                                <>
                                                    <span style={{color:'#64748b',fontWeight:600}}>Phone</span>
                                                    <span style={{color:'#e2e8f0'}}>{deleteConfirmTicket.phoneNumber}</span>
                                                </>
                                            )}
                                            
                                            <span style={{color:'#64748b',fontWeight:600}}>Created</span>
                                            <span style={{color:'#e2e8f0'}}>{deleteConfirmTicket.timestamp ? new Date(deleteConfirmTicket.timestamp).toLocaleString() : 'N/A'}</span>
                                        </div>
                                    </div>
                                    
                                    <div style={{display:'flex',gap:'0.75rem'}}>
                                        <button
                                            className="btn btn-secondary"
                                            onClick={() => setDeleteConfirmTicket(null)}
                                            style={{flex:1}}
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            className="btn btn-danger"
                                            onClick={() => deleteTicket(deleteConfirmTicket.id)}
                                            style={{flex:1}}
                                        >
                                            🗑️ Delete permanently
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* Toast notifications */}
                        {toasts.length > 0 && (
                            <div className="toast-container">
                                {toasts.map(t => (
                                    <div key={t.id} className={`toast toast-${t.type}`}>
                                        <span>{t.type === 'success' ? '✅' : t.type === 'error' ? '❌' : 'ℹ️'}</span>
                                        <span>{t.message}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            }
        }
        
        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
